# Runs the checks that gate this repo: the dependency audit, the plan's tests,
# the linter, and the build. The build is the one that matters most, because a
# broken build is what takes the live site down, and it runs the same command
# Vercel runs.
name: CI

# Every branch, not just main. This repo works straight on main with no pull
# request flow, so a branch filter would leave a feature branch unchecked until
# the moment it lands, which is when it is too late for the check to be cheap.
# The concurrency group below keeps the extra runs from piling up.
on:
  push:
  pull_request:

# A push that supersedes an earlier one makes the earlier run pointless, so
# cancel it instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Audit, test, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci, not npm install: it installs exactly what package-lock.json
      # pins, so CI cannot pass on a version the lock file does not describe.
      - name: Install dependencies
        run: npm ci

      # Fails only on moderate or worse, so low-severity noise cannot block a
      # deploy on its own. It waited for the source-map-js advisory to clear,
      # because a gate that is always red is a gate everybody learns to ignore.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      # The plan's rules, in plain node: no browser, no network, no
      # dependencies of its own, which makes this the fastest step and the one
      # that reports a broken rule first.
      - name: Test
        run: npm test

      # Same command Vercel runs, so a green run here means the deploy will
      # build.
      - name: Build
        run: npm run build
